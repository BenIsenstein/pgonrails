# Kong API gateway override.
#
# Replaces the default Envoy gateway with Kong. Enable with:
#   sh run.sh config add kong
#   sh run.sh start
#
# This overrides the `api-gw` service in place, so its dependents (functions),
# the reverse-proxy overrides (caddy), and the `kong`/`envoy` network aliases
# keep working unchanged. Kong re-adds an HTTPS listener on 8443.

services:
  api-gw:
    build: ./kong
    ports: !override
      - ${KONG_PORT}:${KONG_PORT}/tcp
      - ${KONG_HTTPS_PORT}:${KONG_HTTPS_PORT}/tcp
    healthcheck: !override
      test: [ "CMD", "kong", "health" ]
      timeout: 5s
      interval: 5s
      retries: 5
    environment: !override
      KONG_PROXY_LISTEN: ${KONG_LISTEN}:${KONG_PORT} reuseport backlog=16384, 0.0.0.0:${KONG_PORT} reuseport backlog=16384
      KONG_STATUS_LISTEN: ${KONG_LISTEN}:${KONG_STATUS_PORT}, 0.0.0.0:${KONG_STATUS_PORT}
      # To find the IP address of services, Kong looks for SRV records by default, which don't exist in the Docker Compose internal network DNS
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_ROUTER_FLAVOR: expressions

      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      KONG_NGINX_WORKER_PROCESSES: 2

      # KONG_SSL_CERT: /home/kong/server.crt
      # KONG_SSL_CERT_KEY: /home/kong/server.key

      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}

      # Legacy API keys (HS256-signed JWTs)
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

      # New opaque API keys
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}

      AUTH_HOST: ${AUTH_HOST}
      AUTH_PORT: ${AUTH_PORT}
      REST_HOST: ${REST_HOST}
      REST_PORT: ${REST_PORT}
      META_HOST: ${META_HOST}
      META_PORT: ${META_PORT}
      STUDIO_HOST: ${STUDIO_HOST}
      STUDIO_PORT: ${STUDIO_PORT}
      FUNCTIONS_HOST: ${FUNCTIONS_HOST}
      FUNCTIONS_PORT: ${FUNCTIONS_PORT}
      REALTIME_HOST: ${REALTIME_HOST}
      REALTIME_PORT: ${REALTIME_PORT}
      STORAGE_HOST: ${STORAGE_HOST}
      STORAGE_PORT: ${STORAGE_PORT}
      ANALYTICS_HOST: ${ANALYTICS_HOST}
      ANALYTICS_PORT: ${ANALYTICS_PORT}
