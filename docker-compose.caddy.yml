services:

  # Caddy terminates TLS and forwards to the API gateway (api-gw) on port
  # 8000, so the gateway's own host port binding is removed here. This works
  # for either gateway, since the service is named api-gw in both cases.
  api-gw:
    ports: !reset []
    # When using the Kong override (docker-compose.kong.yml) combined with
    # this file, uncomment the following so Kong's status page reports the
    # external TLS ports correctly:
    #environment:
    #  KONG_PORT_MAPS: "443:8000,443:8443"

  caddy:
    build: ./caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      api-gw:
        condition: service_healthy
      studio:
        condition: service_healthy
    environment:
      PROXY_DOMAIN: ${PROXY_DOMAIN}
      PROXY_AUTH_USERNAME: ${DASHBOARD_USERNAME}
      PROXY_AUTH_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
